# Include at nginx http scope.
map $http_upgrade $pengmanager_bot_connection {
    default upgrade;
    '' close;
}

# The browser gateway receives only its own HttpOnly cookie.
map $http_cookie $pengmanager_bot_viewer_cookie {
    default "";
    "~(?:^|;\s*)(__Secure-pm_bot_viewer=[A-Za-z0-9_-]{43,128})(?:;|$)" $1;
}
