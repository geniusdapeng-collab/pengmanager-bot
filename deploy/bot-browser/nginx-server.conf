# Include inside the existing HTTPS server for PengManager.
location ^~ /api/bot/v1/browser/internal/ {
    return 404;
}

location = /internal/revoke {
    return 404;
}

location ^~ /bot-browser/ {
    access_log off;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:18760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $pengmanager_bot_viewer_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Bot-Browser-Key "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pengmanager_bot_connection;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
